# Docker Compose 生产配置
# 使用 .env.production 作为环境变量来源

services:
  nginx:
    image: nginx:alpine
    container_name: prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod-backend
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4"
    ports:
      - "8000:8000"
    env_file:
      - .env.production  # 使用根目录的统一配置
    volumes:
      - kb_storage_prod:/app/storage
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 将根配置中的 APP_NAME 注入到 Nuxt 构建环境
        APP_NAME: ${APP_NAME}
        PROJECT_NAME: ${PROJECT_NAME}
    container_name: prod-frontend
    env_file:
      - .env.production  # 使用根目录的统一配置
    expose:
      - 3000
    restart: unless-stopped

  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: prod-postgres-db
    command: postgres -c max_connections=200
    env_file:
      - .env.production  # 使用根目录的统一配置
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod-celery-worker
    command: uv run celery -A src.celery_app worker --loglevel=info --pool=gevent --concurrency=100
    env_file:
      - .env.production  # 使用根目录的统一配置
    volumes:
      - kb_storage_prod:/app/storage
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_started
      crawl4ai:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:-}
    restart: unless-stopped


volumes:
  postgres_data_prod:
  redis_data_prod:
  kb_storage_prod:
