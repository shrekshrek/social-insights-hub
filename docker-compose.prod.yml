# Docker Compose 生产配置
# 使用 .env.production 作为环境变量来源

services:
  nginx:
    image: nginx:alpine
    container_name: prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sih_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod-backend
    # 显式单 worker：与本地 dev 环境对齐，避免 module-level lock + APScheduler 多进程重复执行问题。
    # FastAPI 进程只做 I/O 编排（CPU 密集在 Celery worker），单 worker + asyncio 吞吐足以应对企业内部用量。
    # 详见 scheduler.py 注释和 commit message。
    command: sh -c "uv run alembic upgrade head || echo '[warn] alembic failed, continuing...' ; uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8000:8000"
    env_file:
      - .env.production  # 使用根目录的统一配置
    # 抬高文件描述符上限，避免 Redis/PG/HTTP 连接池在高并发下耗尽 FD（Errno 24）。
    # 容器默认 nofile 常为 1024，不足以支撑多连接池叠加。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - kb_storage_prod:/app/storage
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sih_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 将根配置中的 APP_NAME 注入到 Nuxt 构建环境
        APP_NAME: ${APP_NAME}
        PROJECT_NAME: ${PROJECT_NAME}
    container_name: prod-frontend
    env_file:
      - .env.production  # 使用根目录的统一配置
    expose:
      - 3000
    networks:
      - sih_net
    restart: unless-stopped

  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: prod-postgres-db
    command: postgres -c max_connections=200
    env_file:
      - .env.production  # 使用根目录的统一配置
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sih_net
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod-celery-worker
    # 并发由 100 降至 50：LLM 任务多在等待 I/O，降并发对吞吐影响小，
    # 但显著减少 Redis/PG 连接池占用的 FD，缓解 Errno 24（Too many open files）。
    command: uv run celery -A src.celery_app worker --loglevel=info --pool=gevent --concurrency=50
    env_file:
      - .env.production  # 使用根目录的统一配置
    # 抬高文件描述符上限：gevent 并发 ×（Redis 同步池 + PG 池 + Celery broker/backend 池）
    # 在 chord 扇出汇总时峰值很高，容器默认 1024 会被打满。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - kb_storage_prod:/app/storage
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_started
      crawl4ai:
        condition: service_started
    networks:
      - sih_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    # 抬高 FD 上限：作为 broker + result backend + 应用缓存，承接所有 worker/backend 连接，
    # 默认 1024 在高并发下会成为服务端瓶颈。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - redis_data_prod:/data
    networks:
      - sih_net
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:-}
    # Chromium 共享内存：默认 64MB 在重页面下会 OOM → /crawl 返回 500。官方生产建议 2g。
    # 资源（若宿主机允许）：官方建议 mem 8g / cpu 4，视服务器实际内存再加 mem_limit/cpus。
    shm_size: "2gb"
    networks:
      - sih_net
    restart: unless-stopped


networks:
  sih_net:
    name: sih_prod_network  # 显式固定网络名，避免重建容器时 Compose 创建新网络导致服务间 DNS 失联

volumes:
  postgres_data_prod:
  redis_data_prod:
  kb_storage_prod:
