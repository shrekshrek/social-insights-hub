# Docker Compose 项目名从 PROJECT_NAME 环境变量自动生成
# 这确保了多个基于此脚手架的项目可以同时运行而不会冲突
name: "${PROJECT_NAME:-fullstack-app}"

services:
  postgres_db:
    image: pgvector/pgvector:pg16
    # 不使用固定 container_name，让 Docker Compose 基于项目名自动生成
    # 格式: {project_name}_postgres_db_1
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_db}
    ports:
      - "5432:5432"
    volumes:
      # 使用项目名前缀的数据卷，确保不同项目的数据隔离
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # 不使用固定 container_name，让 Docker Compose 基于项目名自动生成
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 不使用固定 container_name，让 Docker Compose 基于项目名自动生成
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - uv_cache:/root/.cache/uv
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --reload"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - UV_HTTP_TIMEOUT=300
    env_file:
      - .env
    dns:
      - 8.8.8.8
    depends_on:
      - postgres_db
      - redis

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 不使用固定 container_name，让 Docker Compose 基于项目名自动生成
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - uv_cache:/root/.cache/uv
    # Celery 自动处理 gevent monkey patching（--pool=gevent 触发）
    command: sh -c "uv run celery -A src.celery_app worker --loglevel=info --pool=gevent --concurrency=100"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - UV_HTTP_TIMEOUT=300
    env_file:
      - .env
    dns:
      - 8.8.8.8
    depends_on:
      - postgres_db
      - redis

  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:-}
    restart: unless-stopped


volumes:
  # 数据卷会自动使用项目名前缀: {PROJECT_NAME}_postgres_data
  # Docker Compose 会根据项目名自动为数据卷添加前缀，确保项目间数据隔离
  postgres_data:
  redis_data:
  # uv 包缓存，避免每次重启容器都重新下载 python 依赖
  uv_cache:
  # 后端 .venv 命名卷，跨容器重建持久化（避免每次 compose recreate 时 uv sync 从头装）
  # backend + celery-worker 共享同一个 .venv，依赖完全一致
  backend_venv: 