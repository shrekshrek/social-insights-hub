user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip 压缩，减少 JS/CSS 传输体积
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss image/svg+xml font/ttf font/otf font/woff font/woff2;

    # 静态资源缓存（浏览器本地缓存，减少重复请求）
    # 注意：Nuxt 的 _nuxt/ 目录下文件名含 hash，可以长期缓存
    map $uri $cache_control {
        ~*/_nuxt/   "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    # 允许最大 20MB 请求体（PDF/DOCX 上传）
    client_max_body_size 20m;

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name shrek.wang www.shrek.wang;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name shrek.wang www.shrek.wang;

        ssl_certificate     /etc/nginx/ssl/shrek.wang_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/shrek.wang.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 使用 Docker 内置 DNS，valid=10s 强制每 10 秒重新解析
        # 确保容器重建后 nginx 能自动感知新 IP，不再出现 502
        resolver 127.0.0.11 valid=10s ipv6=off;

        # 安全头配置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # strategies 所有接口均为 LLM 长耗时操作，统一超时设为 10 分钟
        location ^~ /api/v1/strategies {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            # 文件上传：等待客户端发送请求体的超时（默认60s，上传大PDF需要更长）
            client_body_timeout 120s;
            # 缓冲区：允许先把请求体缓存到磁盘再转发，避免上传卡住后端
            proxy_request_buffering on;
        }

        # Proxy /api/v1/ requests to the backend FastAPI service
        location /api/v1/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/auth/ and other /api/ routes go to Nuxt server (handled below by location /)


        # FastAPI 文档与 OpenAPI JSON
        location = /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /redoc {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nuxt 静态资源（带 hash，永久缓存）
        location ~* ^/_nuxt/ {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Proxy all other requests to the frontend service
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
} 
